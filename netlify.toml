[build]
  command = "node build-admin.js && npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
