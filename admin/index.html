<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin — Heartbeat Ministries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0c0a08; color: #e8e0d4; font-family: 'DM Sans', sans-serif; }
    #admin-root { min-height: 100vh; }
    /* Auth gate */
    #auth-gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 24px; text-align: center;
    }
    #auth-gate h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #c4a474; }
    #auth-gate p { color: rgba(232,224,212,.65); }
    #auth-gate button {
      background: #c4a474; color: #0c0a08; border: none; padding: 12px 32px;
      font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }
    #auth-gate button:hover { background: #dbb867; }
  </style>
</head>
<body>
  <div id="admin-root">
    <div id="auth-gate">
      <h1>Heartbeat Ministries</h1>
      <p>Sign in to manage your site</p>
      <button onclick="netlifyIdentity.open()">Sign In</button>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="bundle.js"></script>
  <script>
    // Wait for Netlify Identity to initialize (guard against double-mount)
    var mounted = false;
    function mountAdmin() {
      if (mounted) return;
      mounted = true;
      document.getElementById('auth-gate').style.display = 'none';
      HeartbeatAdmin.mount(document.getElementById('admin-root'));
    }
    netlifyIdentity.on('init', function(user) {
      if (user) mountAdmin();
    });
    netlifyIdentity.on('login', function(user) {
      mountAdmin();
    });
    netlifyIdentity.on('logout', function() {
      window.location.reload();
    });
    netlifyIdentity.init();
  </script>
</body>
</html>
